name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# -----------------------------------------------------------
# 软件仓库 CI（仅 Android Java 构建）
#
# bootstrap 交叉编译已移到 XION-HN/haisa-des-bootstrap 仓库独立 CI，
# 本仓库每次 push 不再重建 bootstrap（省 10+ 分钟）。
# apk job 从公开发布仓库 XION-HN/haisa-des-repo 的 Releases latest/download/
# 拉预构建的 bootstrap-arm64-v8a.zip 注入 APK assets。
#
# 资源流转：
#   haisa-des-bootstrap CI (tag) → 上传到 haisa-des-repo Releases
#   haisa-des 软件 CI (此文件)  → 从 Releases latest/download/ 拉 bootstrap.zip
#   App 端                       → 从 Releases latest/download/ 拉 packages.json
#
# 首次跑（Releases 还没有 bootstrap）：用占位 zip 让 assembleDebug 通过，
# 仅验证 Java 编译。tag 触发时若 Releases 还没东西，应先去 bootstrap 仓库发 tag。
# -----------------------------------------------------------

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Download bootstrap.zip from Releases
        id: dl_bootstrap
        continue-on-error: true
        run: |
          set -e
          mkdir -p app/src/main/assets/bootstrap
          URL="https://github.com/XION-HN/haisa-des-repo/releases/latest/download/bootstrap-arm64-v8a.zip"
          echo "下载 $URL ..."
          # -L 跟随 302，-f 失败时返回非 0
          if curl -L -f --retry 3 --retry-delay 2 -o app/src/main/assets/bootstrap/bootstrap-arm64-v8a.zip "$URL"; then
            ls -la app/src/main/assets/bootstrap/
            echo "downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Releases 暂无 bootstrap（首次跑或 bootstrap 仓库还没发 tag）"
            echo "downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Create placeholder asset (when download failed)
        if: steps.dl_bootstrap.outputs.downloaded != 'true'
        run: |
          echo "⚠ 用占位 zip 让 assembleDebug 通过验证 Java 编译（产物 APK 不能用于真机）"
          mkdir -p app/src/main/assets/bootstrap
          printf 'placeholder' > app/src/main/assets/bootstrap/bootstrap-arm64-v8a.zip

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        continue-on-error: true   # 配额耗尽时不阻塞 CI
        uses: actions/upload-artifact@v4
        with:
          name: haisa-des-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
