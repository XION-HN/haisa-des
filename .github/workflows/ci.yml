name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # 交叉编译：NDK r29 构建 14 个包（含 Python 3.13 + pip）→ bootstrap zip + 单包 tar.gz + packages.json
  # prod = 正式 prefix（打进 APK）；test = Termux 冒烟 prefix
  # -----------------------------------------------------------
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          # tag 触发时用真实 tag；push 触发时用 latest 占位（仅作 artifact 上传）
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
            build-system/dist/packages.json
          retention-days: 30

  # -----------------------------------------------------------
  # Release：打 tag 时上传 tar.gz + packages.json 到【公开发布仓库】的 Releases
  #
  # 软件开发 CI 在私有仓库 XION-HN/androlinux 跑；但 release 资产必须放公开仓库
  # XION-HN/androlinux-repo，App 端无 token 才能拉到 packages.json 和 tar.gz。
  # 故 release job 跨仓库上传：用 PAT（存为 secret RELEASE_REPO_TOKEN）
  # 在公开仓库创建 release 并上传资产。
  # App 侧 PackageManager 通过 releases/latest/download/packages.json 发现并下载包。
  # -----------------------------------------------------------
  release:
    needs: bootstrap
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prod artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-prod
          path: /tmp/bootstrap-prod

      - name: Upload to public release repo (cross-repo)
        uses: softprops/action-gh-release@v2
        with:
          # 目标公开发布仓库（owner/repo），与开发仓库分离
          repository: XION-HN/androlinux-repo
          # 跨仓库操作需要 PAT，默认 GITHUB_TOKEN 只能操作当前私有仓库
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            /tmp/bootstrap-prod/packages.json
            /tmp/bootstrap-prod/packages/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  # -----------------------------------------------------------
  # APK：注入 prod bootstrap 资产 → assembleDebug（侧载分发）
  # -----------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Inject prod bootstrap asset
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-prod
          path: /tmp/bootstrap

      - name: Place asset
        run: |
          ls -la /tmp/bootstrap/
          mkdir -p app/src/main/assets/bootstrap
          cp /tmp/bootstrap/bootstrap-arm64-v8a.zip app/src/main/assets/bootstrap/
          ls -la app/src/main/assets/bootstrap/

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androlinux-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
