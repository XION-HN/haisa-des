name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # 交叉编译：NDK r29 构建 14 个包（含 Python 3.13 + pip）→ bootstrap zip + 单包 tar.gz + packages.json
  # prod = 正式 prefix（打进 APK）；test = Termux 冒烟 prefix
  # -----------------------------------------------------------
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          # tag 触发时用真实 tag；push 触发时用 latest 占位（仅作 artifact 上传）
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
            build-system/dist/packages.json
          retention-days: 30

  # -----------------------------------------------------------
  # 通知公开发布仓库跑"资源 CI"
  #
  # 软件开发 CI（bootstrap + apk）只在私有仓库跑，不碰 release 资产。
  # 打 tag 时，这里向公开仓库 XION-HN/androlinux-repo 发 repository_dispatch 事件，
  # 把本次 run_id 和 tag 传过去；公开仓库 CI 收到后用 PAT 反向下载本仓库的
  # bootstrap-prod artifact，再上传到它自己的 GitHub Releases。
  # 这样：私有仓库专注软件构建，公开仓库专注 release 资产托管，职责分离。
  # -----------------------------------------------------------
  notify-release:
    needs: [bootstrap, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to public release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/XION-HN/androlinux-repo/dispatches \
            -d "{
              \"event_type\": \"publish-release\",
              \"client_payload\": {
                \"tag\": \"${{ github.ref_name }}\",
                \"source_repo\": \"${{ github.repository }}\",
                \"source_run_id\": \"${{ github.run_id }}\"
              }
            }"
          echo "已通知 androlinux-repo 跑资源 CI（tag=${{ github.ref_name }}, run_id=${{ github.run_id }}）"

  # -----------------------------------------------------------
  # APK：注入 prod bootstrap 资产 → assembleDebug（侧载分发）
  # -----------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Inject prod bootstrap asset
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-prod
          path: /tmp/bootstrap

      - name: Place asset
        run: |
          ls -la /tmp/bootstrap/
          mkdir -p app/src/main/assets/bootstrap
          cp /tmp/bootstrap/bootstrap-arm64-v8a.zip app/src/main/assets/bootstrap/
          ls -la app/src/main/assets/bootstrap/

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androlinux-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
