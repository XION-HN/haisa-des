name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# -----------------------------------------------------------
# 软件 CI（在 xion-hn-studio 账号跑，避开 XION-HN Actions 配额耗尽问题）
# 仓库本身是 XION-HN/haisa-des 的镜像，源码仍以 XION-HN/haisa-des 为权威。
#
# bootstrap 交叉编译在 xion-hn-studio/haisa-des-bootstrap 独立 CI 跑，
# 产物发布到 XION-HN/haisa-des-repo Releases。
#
# 资源流转：
#   haisa-des-bootstrap CI (tag) → 上传到 XION-HN/haisa-des-repo Releases
#   本 CI (push/tag)            → 从 Releases download/<tag>/ 拉 bootstrap.zip
#   tag 触发                     → 上传 APK 到 XION-HN/haisa-des-repo Releases
#   App 端                      → 从 Releases latest/download/ 拉 packages.json
# -----------------------------------------------------------

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Download bootstrap.zip from Releases
        id: dl_bootstrap
        continue-on-error: true
        env:
          # bootstrap-arm64-v8a.zip 按首字母 'b' 归到 pip-b release（26 字母布局）
          # 见 haisa-des-repo/scripts/organize-repo.sh 的首字母规则
          BOOTSTRAP_TAG: pip-b
        run: |
          set -e
          mkdir -p app/src/main/assets/bootstrap
          URL="https://github.com/XION-HN/haisa-des-repo/releases/download/${BOOTSTRAP_TAG}/bootstrap-arm64-v8a.zip"
          echo "下载 $URL ..."
          # -L 跟随 302，-f 失败时返回非 0
          if curl -L -f --retry 3 --retry-delay 2 -o app/src/main/assets/bootstrap/bootstrap-arm64-v8a.zip "$URL"; then
            ls -la app/src/main/assets/bootstrap/
            echo "downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Releases 暂无 bootstrap（pip-b release 中无 bootstrap-arm64-v8a.zip）"
            echo "downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Create placeholder asset (when download failed)
        if: steps.dl_bootstrap.outputs.downloaded != 'true'
        run: |
          echo "⚠ 用占位 zip 让 assembleDebug 通过验证 Java 编译（产物 APK 不能用于真机）"
          mkdir -p app/src/main/assets/bootstrap
          printf 'placeholder' > app/src/main/assets/bootstrap/bootstrap-arm64-v8a.zip

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        continue-on-error: true   # 配额耗尽时不阻塞 CI
        uses: actions/upload-artifact@v4
        with:
          name: haisa-des-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------
      # tag 触发：把 APK 上传到 XION-HN/haisa-des Releases
      # haisa-des 仓库是 App 主仓库，APK 作为 release 资产发布在这里
      # （bootstrap 资源发布在 XION-HN/haisa-des-repo，职责分离）
      # -----------------------------------------------------------
      - name: Publish APK to haisa-des Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HAISADES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "错误: secrets.HAISADES_REPO_TOKEN 未配置（需 XION-HN/haisa-des 的 PAT，contents:write 权限）"
            exit 1
          fi

          REPO="XION-HN/haisa-des"
          APK_DIR="app/build/outputs/apk/debug"
          APK_NAME="haisa-des-${TAG}-debug.apk"

          echo "=== 发布 APK 到 $REPO release $TAG ==="
          ls -la "$APK_DIR/"

          # 重命名 APK 为带版本号的文件名
          cp "$APK_DIR/app-debug.apk" "$APK_DIR/$APK_NAME"

          # 检查 release 是否已存在；不存在则创建
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "创建 release $TAG on $REPO"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "haisa-des $TAG" \
              --notes "haisa-des release $TAG

          debug APK，内置 bootstrap v0.4.0（精简版：bash + apt + curl 等基础工具，python 需 apt install python 安装）。

          下载 \`haisa-des-${TAG}-debug.apk\` 安装到 arm64-v8a Android 设备。" \
              --latest
          fi

          # 上传 APK（--clobber 覆盖同名）
          gh release upload "$TAG" --repo "$REPO" \
            "$APK_DIR/$APK_NAME" \
            --clobber

          echo "✓ 已发布 $APK_NAME 到 $REPO release $TAG"
          echo "  下载链接（公开）:"
          echo "    https://github.com/$REPO/releases/latest/download/$APK_NAME"
